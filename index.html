<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spa Khai Hoan - Pi Mainnet</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
body{font-family:sans-serif;background:#f5f5f5;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}
.card{background:#fff;padding:24px;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,0.1);text-align:center;max-width:360px;width:90%}
h1{margin:0 0 8px}
button{background:#6a5af9;color:#fff;border:0;padding:12px 20px;border-radius:10px;font-size:16px;width:100%;margin-top:12px}
#log{margin-top:16px;font-size:13px;text-align:left;background:#111;color:#0f0;padding:10px;border-radius:8px;min-height:60px;word-break:break-all}
</style>
</head>
<body>
<div class="card">
<h1>Spa Khai Hoan</h1>
<p>Thanh toan Pi Mainnet</p>
<button id="btn">Thanh toan 1 Pi</button>
<div id="log">San sang Mainnet</div>
</div>
<script>
const log = (m)=>{document.getElementById('log').innerHTML+=`<br>${m}`;}
window.addEventListener('load', ()=>{
  Pi.init({version:"2.0"});
  log('Pi SDK MAINNET san sang');
});
document.getElementById('btn').onclick = async ()=>{
  try{
    const auth = await Pi.authenticate(['username','payments']);
    log('@'+auth.user.username);
    await Pi.createPayment({
      amount: 1,
      memo: "Spa Khai Hoan Mainnet",
      metadata: {service:"spa-mainnet"}
    },{
      onReadyForServerApproval: async (id)=>{
        log('Approve '+id);
        const r = await fetch("/api/approve",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({paymentId:id})});
        const j = await r.json(); log('Approve: '+JSON.stringify(j));
      },
      onReadyForServerCompletion: async (id,txid)=>{
        log('Complete '+txid);
        const r = await fetch("/api/complete",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({paymentId:id,txid:txid})});
        const j = await r.json(); log('Complete: '+JSON.stringify(j));
      },
      onCancel: (id)=>log('Huy: '+id),
      onError: (e)=>log('Loi: '+e.message)
    });
  }catch(e){log('Loi: '+e.message)}
};
</script>
</body>
</html>
